name: vetply

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=vetply
    ports:
      - "6235:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "7856:6379"
    volumes:
      - redis:/data
    command: redis-server --requirepass local-password --appendonly yes

volumes:
  postgres_data:
    driver: local
  redis:
    driver: local
